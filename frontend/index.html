<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Employee Onboarding</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 30px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .progress-container {
      width: 100%;
      background: #ddd;
      border-radius: 20px;
      margin: 20px 0;
    }

    .progress-bar {
      height: 30px;
      width: 0%;
      background: #4CAF50;
      color: white;
      text-align: center;
      line-height: 30px;
      border-radius: 20px;
    }

    .stage {
      padding: 15px;
      margin: 10px 0;
      border-radius: 6px;
      background: #eee;
    }

    .complete {
      background: #d4edda;
    }

    .in-progress {
      background: #fff3cd;
    }

    .not-started {
      background: #f8d7da;
    }

    button {
      padding: 10px 15px;
      margin: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Employee Onboarding Portal</h1>

  <button id="loginButton" onclick="login()">Login</button>
  <button id="logoutButton" onclick="logout()" style="display:none;">Logout</button>

  <p id="employeeName"></p>

  <h2>Progress</h2>

  <div class="progress-container">
    <div id="progressBar" class="progress-bar">
      0%
    </div>
  </div>

  <div id="stages"></div>

</div>

<script src="app.js"></script>

</body>
</html>
